      description: Requires candidate ownership and active membership in the target active group.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRecommendationRequest'
      responses:
        '201':
          description: Recommendation candidate shared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRecommendationShareResponse'
        '400':

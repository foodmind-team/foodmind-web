  /food-records:
    post:
      tags:
        - Food Records
      summary: Create an owner-controlled food record.
      description: Owner is derived from the JWT. GROUP visibility requires active membership in the target active group.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFoodRecordRequest'
      responses:
        '201':
          description: Food record created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              description: Current optimistic-lock version.
              schema:
                type: string
                example: '"0"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Food Records
      summary: List authorised food history cards.
      description: Returns owner records and authorised group records through one permission-scoped SQL predicate. Deleted records are excluded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cuisineId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: mealId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: placeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum:
              - PRIVATE
              - GROUP
        - name: groupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: minRating
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 5
        - name: maxRating
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 5
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Authorised food history page.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRecordPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /food-records/{id}:
    get:
      tags:
        - Food Records
      summary: Read an authorised food record detail.
      description: Uses a permission-scoped query and returns non-disclosing 404 when inaccessible.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Food record detail.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              description: Current optimistic-lock version.
              schema:
                type: string
                example: '"0"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Food Records
      summary: Update an owned food record.
      description: Requires If-Match with the current version. Non-owners receive non-disclosing 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            example: '"0"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFoodRecordRequest'
      responses:
        '200':
          description: Updated food record.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              description: New optimistic-lock version.
              schema:
                type: string
                example: '"1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Food Records
      summary: Soft-delete an owned food record.
      description: Repeated owner delete is idempotent. Deleted rows are excluded from normal queries.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Food record deleted or already deleted for this owner.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'

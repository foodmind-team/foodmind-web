        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /catalogue-images/{sourceId}:
    get:
      tags:
        - Catalogue
      summary: Read a public curated catalogue image.
      description: Returns only bundled non-sensitive artwork for a mapped curated catalogue item. The response is never cached so both clients observe an updated registry immediately.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 21000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Curated JPEG artwork.
          headers:
            Cache-Control:
              description: Always no-store for this small server-owned registry.
              schema:
                type: string
                example: no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /catalogue/reference-data:
    get:
      tags:
        - Catalogue
      summary: Read controlled catalogue reference choices.
      description: Returns stable cuisine, dietary-tag, allergen, meal-type, and place-type choices from the controlled catalogue.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Controlled catalogue reference choices.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueReferenceDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /catalogue/meals/{id}:
    get:
      tags:
        - Catalogue
      summary: Read an active controlled meal.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 20000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Active meal detail with active place-specific offerings.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueMealResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /catalogue/places/{id}:
    get:
      tags:
        - Catalogue
      summary: Read an active controlled place.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 21000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Active place detail with decision-support observations and active offerings.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CataloguePlaceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /catalogue/places/{id}/walking-route:
    get:
      tags:
        - Catalogue
      summary: Return a transient OneMap walking route to an active controlled place.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: originLatitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: originLongitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Walking route. Origin is not stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkingRouteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: OneMap walking directions are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /catalogue/products/{id}:
    get:
      tags:
        - Catalogue
      summary: Read an active controlled food product.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 23000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Active product detail with controlled dietary and allergen classifications.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate a refresh session and issue a new access token.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh token rotated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Replacement refresh and CSRF cookies for web clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke the supplied refresh session.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh session revoked and auth cookies cleared.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Expired refresh and CSRF cookies.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Revoke every active refresh session for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Active refresh sessions revoked and auth cookies cleared.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Expired refresh and CSRF cookies.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags:
        - Users
      summary: Read the authenticated user's profile.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'

      responses:
        '201':
          description: Drink record created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              description: Current optimistic-lock version.
              schema:
                type: string
                example: '"0"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Drink Records
      summary: List authorised drink history cards.
      description: Returns owner records and authorised group records through one permission-scoped SQL predicate. Deleted records are excluded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: placeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum:
              - PRIVATE
              - GROUP
        - name: groupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: minRating
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 5
        - name: maxRating
          in: query
          required: false

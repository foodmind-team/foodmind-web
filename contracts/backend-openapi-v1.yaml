  /search:
    get:
      tags:
        - Saved Search and Explore
      summary: Search authorised platform content.
      description: Calls the PostgreSQL authorised search function with bounded query text, allow-listed source types, and all-or-none cursor pagination.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: types
          in: query
          required: false
          description: Comma-separated allow-list of FOOD_RECORD, FOOD_PRODUCT, PLACE.
          schema:
            type: string
            example: PLACE,FOOD_PRODUCT
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Compatibility parameter; cursor pagination requires 0.
          schema:
            type: integer
            minimum: 0
            maximum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Authorised search page.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

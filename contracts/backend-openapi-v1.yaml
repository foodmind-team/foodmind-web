        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/CookingQuestionAnswer'
      responses:
        '202':
          description: Child task accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanAsyncAcceptedResponse'
        '200':
          description: Terminal FAILED plan returned because task submission failed.
          content:

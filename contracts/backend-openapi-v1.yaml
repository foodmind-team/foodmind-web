        - suggestedQuestions
        - suggestedDestinations
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - USER
            - ASSISTANT
        content:
          type: string
          maxLength: 12000
        responseStatus:
          type: string
          nullable: true
          enum:
            - SUCCEEDED
            - FALLBACK_SUCCEEDED
            - UNSUPPORTED
            - FAILED
        correlationId:
          type: string
          format: uuid
        agentTraceId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageSourceResponse'
        suggestedQuestions:
          description: Up to three safe follow-up prompts generated for this answer.
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 200
        suggestedDestinations:
          description: Up to three allowlisted FoodMind screens relevant to the answer.
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              - INVENTORY
              - SHOPPING_LISTS
              - SAVED_RECIPES
              - COOKING_PLANS
              - RECOMMENDATIONS
              - EXPLORE
    ChatSessionPageResponse:
      type: object
      required:
        - items
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatSessionResponse'
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean
    ChatMessagePageResponse:
      type: object
      required:
        - items
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageResponse'
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean
    DashboardMetricResponse:
      type: object
      required:
        - code
        - label
        - period
        - unit
        - empty
      properties:
        code:
          type: string
          example: SPENDING_TOTAL
        label:
          type: string
          example: Spending total
        period:
          type: string
          format: date
        value:
          type: number
          nullable: true
          example: 24.50
        unit:
          type: string
          enum: [COUNT, RATING, RATE, MONEY]
        currency:
          type: string
          nullable: true
          example: SGD
        samples:
          type: integer
          format: int64
          nullable: true
        denominator:
          type: integer
          format: int64
          nullable: true
        empty:
          type: boolean
          description: True when the metric denominator or value is undefined; clients must not invent zero.
        dimension:
          type: string
          nullable: true
          example: SGD
        dimensionLabel:
          type: string
          nullable: true
          example: Singapore dollar
    DashboardResponse:
      type: object
      required: [from, to, groupBy, timeZone, empty, metrics, spendingTotals]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        groupBy:
          type: string
          enum: [DAY, WEEK, MONTH]
        timeZone:
          type: string
          example: Asia/Singapore
        empty:
          type: boolean
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMetricResponse'
        spendingTotals:
          type: array
          description: Convenience subset of metrics containing one total per currency and period.
          items:
            $ref: '#/components/schemas/DashboardMetricResponse'
    WeeklyRecapResponse:
      type: object
      required: [weekStart, timeZone, empty, metrics, spendingTotals]
      properties:
        weekStart:
          type: string
          format: date
        timeZone:
          type: string
        empty:
          type: boolean
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMetricResponse'
        spendingTotals:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMetricResponse'
  responses:
    BadRequest:
      description: Request validation or JSON parsing failed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication is required or invalid.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Authenticated principal is not permitted.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource was not found or cannot be disclosed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Upstream dependency is unavailable.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Unexpected safe server error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
paths:
  /media/uploads:
    post:
      tags: [Media]
      summary: Create a bounded, owner-controlled pending image upload.
      description: Returns a sensitive short-lived presigned PUT instruction. Clients must not log, share, or send the Backend bearer token to the returned URL.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUploadRequest'
      responses:
        '201':
          description: Pending asset and one short-lived upload instruction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadInstructionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /media/{mediaAssetId}/finalise:
    post:
      tags: [Media]
      summary: Verify uploaded object metadata and make an owned asset READY.
      security:
        - bearerAuth: []
      parameters:
        - name: mediaAssetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Verified READY asset; repeating the call is idempotent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAssetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Object storage could not be reached; no storage error details are disclosed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }
  /media/{mediaAssetId}:
    delete:
      tags: [Media]
      summary: Soft-delete an owned asset and schedule idempotent object cleanup.
      security:
        - bearerAuth: []
      parameters:
        - name: mediaAssetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Asset deactivated; physical deletion is retried if needed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dashboard:
    get:
      tags:
        - Analytics
      summary: Read server-owned dashboard metrics for a bounded local date range.
      description: Metrics are derived only from the authenticated owner's non-deleted source records and explicit recommendation feedback. Currency totals are always returned separately.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Exclusive upper boundary.
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [DAY, WEEK, MONTH]
            default: DAY
        - name: timeZone
          in: query
          required: false
          description: Optional IANA timezone. Defaults to the authenticated user's profile timezone.
          schema:
            type: string
            example: Asia/Singapore
      responses:
        '200':
          description: Presentation-neutral metrics with explicit empty-state metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /weekly-recaps/{weekStart}:
    get:
      tags:
        - Analytics
      summary: Read a concise owner-local weekly recap.
      description: weekStart must be a Monday in the authenticated user's profile timezone. No cross-currency total is calculated.
      security:
        - bearerAuth: []
      parameters:
        - name: weekStart
          in: path
          required: true
          schema:
            type: string
            format: date
            example: '2026-07-27'
      responses:
        '200':
          description: Weekly recap or explicit empty projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyRecapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /chat/sessions:
    post:
      tags:
        - Chat
      summary: Create an owner-scoped Chat session.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '201':
          description: Created Chat session.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Chat
      summary: List active owner-scoped Chat sessions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Active Chat sessions.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /chat/sessions/{sessionId}:
    get:
      tags:
        - Chat
      summary: Read an owner-scoped Chat session.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chat session.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Chat
      summary: Archive an owner-scoped Chat session.
      description: Archive is a status transition; messages and references are retained.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Chat session archived.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/sessions/{sessionId}/references:
    post:
      tags:
        - Chat
      summary: Share one authorised FoodMind source into Chat.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareChatReferenceRequest'
      responses:
        '201':
          description: Shared Chat reference.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReferenceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/sessions/{sessionId}/messages:
    post:
      tags:
        - Chat
      summary: Send a bounded user message and persist a grounded assistant result.
      description: The Backend replays completed retries with the same Idempotency-Key, supplies bounded recent conversation turns to the Agent, and re-authorises cited sources before storing assistant grounding links. The header remains optional temporarily for older clients; clients that implement Retry should always send it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostChatMessageRequest'
      responses:
        '201':
          description: Assistant message result.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Chat message request failed schema validation.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    get:
      tags:
        - Chat
      summary: Page through owner-scoped Chat messages in stable order.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Chat message page.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /cooking-plans/generate:
    post:
      tags:
        - Cooking Plans
      operationId: generateCookingPlan
      summary: Generate a controlled cooking plan.
      description: Requires Idempotency-Key. The backend persists the request, resolves hard dietary/allergy rules, sends only active controlled recipe candidates to the Cooking Agent outside a database transaction, validates the structured result, and stores an immutable output snapshot.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCookingPlanRequest'
      responses:
        '201':
          description: Cooking plan created or resolved from a matching idempotent retry.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /cooking-plans/{planId}:
    get:
      tags:
        - Cooking Plans
      operationId: getCookingPlan
      summary: Read an owned cooking plan.
      description: Owner-only read returning immutable request and output snapshots.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persisted cooking plan.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /cooking-plans/{planId}/saved:
    put:
      tags:
        - Cooking Plans
      operationId: saveCookingPlan
      summary: Add an owned READY plan to Saved.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persisted saved state and current execution progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanExecutionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Cooking Plans
      operationId: removeSavedCookingPlan
      summary: Remove an owned plan from Saved without deleting its immutable history.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resetProgress
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Plan removed from Saved; progress is retained unless resetProgress is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanExecutionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cooking-plans/{planId}/execution:
    get:
      tags:
        - Cooking Plans
      operationId: getCookingPlanExecution
      summary: Read account-synchronised saved state and execution progress.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current execution snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanExecutionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Cooking Plans
      operationId: updateCookingPlanExecution
      summary: Advance one execution step with optimistic concurrency.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookingPlanExecutionUpdateRequest'
      responses:
        '200':
          description: Updated execution snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanExecutionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cooking-plans/{planId}/execution/reset:
    post:
      tags:
        - Cooking Plans
      operationId: resetCookingPlanExecution
      summary: Reset all unfinished execution progress.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedVersion
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Empty execution snapshot at the next version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanExecutionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cooking-plans/{planId}/finish:
    post:
      tags:
        - Cooking Plans
      operationId: finishCookingPlan
      summary: Finish a cooking plan and consume its allocated inventory.
      description: Owner-only, idempotent completion of a READY plan. Inventory deductions, automatic archival of depleted lots, and finishedAt persistence are atomic; a conflicting inventory change returns 409 without partial deductions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persisted finished plan. Repeated requests return the same completed result without consuming inventory again.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /cooking-plans/{planId}/decisions:
    post:
      tags:
        - Cooking Plans
      operationId: submitCookingPlanDecisions
      summary: Submit decisions for a NEEDS_CONFIRMATION plan.
      description: Validates the answers against the presented confirmation questions, guards the plan revision (409 when the plan is not awaiting confirmation), and re-runs the agent to produce a new revision plan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/CookingQuestionAnswer'
      responses:
        '200':
          description: The new revision plan produced from the submitted decisions.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':

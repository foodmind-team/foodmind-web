  responses:
    BadRequest:
      description: Request validation or JSON parsing failed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication is required or invalid.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Authenticated principal is not permitted.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource was not found or cannot be disclosed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Upstream dependency is unavailable.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Unexpected safe server error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
paths:
  /media/uploads:
    post:
      tags: [Media]
      summary: Create a bounded, owner-controlled pending image upload.
      description: Returns a sensitive short-lived presigned PUT instruction. Clients must not log, share, or send the Backend bearer token to the returned URL.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUploadRequest'
      responses:
        '201':
          description: Pending asset and one short-lived upload instruction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadInstructionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /media/{mediaAssetId}/finalise:
    post:
      tags: [Media]
      summary: Verify uploaded object metadata and make an owned asset READY.
      security:
        - bearerAuth: []
      parameters:
        - name: mediaAssetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Verified READY asset; repeating the call is idempotent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAssetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Object storage could not be reached; no storage error details are disclosed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }
  /media/{mediaAssetId}:
    delete:
      tags: [Media]
      summary: Soft-delete an owned asset and schedule idempotent object cleanup.
      security:
        - bearerAuth: []
      parameters:
        - name: mediaAssetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Asset deactivated; physical deletion is retried if needed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dashboard:
    get:
      tags:
        - Analytics
      summary: Read server-owned dashboard metrics for a bounded local date range.
      description: Metrics are derived only from the authenticated owner's non-deleted source records and explicit recommendation feedback. Currency totals are always returned separately.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Exclusive upper boundary.
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [DAY, WEEK, MONTH]
            default: DAY
        - name: timeZone
          in: query
          required: false
          description: Optional IANA timezone. Defaults to the authenticated user's profile timezone.
          schema:
            type: string
            example: Asia/Singapore
      responses:
        '200':
          description: Presentation-neutral metrics with explicit empty-state metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /weekly-recaps/{weekStart}:
    get:
      tags:
        - Analytics
      summary: Read a concise owner-local weekly recap.
      description: weekStart must be a Monday in the authenticated user's profile timezone. No cross-currency total is calculated.
      security:
        - bearerAuth: []
      parameters:
        - name: weekStart
          in: path
          required: true
          schema:
            type: string
            format: date
            example: '2026-07-27'
      responses:
        '200':
          description: Weekly recap or explicit empty projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyRecapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /chat/sessions:
    post:
      tags:
        - Chat
      summary: Create an owner-scoped Chat session.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '201':
          description: Created Chat session.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Chat
      summary: List active owner-scoped Chat sessions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Active Chat sessions.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /chat/sessions/{sessionId}:
    get:
      tags:
        - Chat
      summary: Read an owner-scoped Chat session.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chat session.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
        '401':

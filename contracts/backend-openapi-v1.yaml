  /cooking-plans/generate-async:
    post:
      tags:
        - Cooking Plans
      operationId: generateCookingPlanAsync
      summary: Submit an async cooking-plan generation task.
      description: Requires Idempotency-Key. An equivalent prior READY schedule is returned immediately with 200 after current inventory validation; otherwise returns 202 with a task handle and the background coordinator materialises the terminal plan. If submission itself fails, a terminal FAILED plan is returned with 200.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCookingPlanRequest'
      responses:
        '202':
          description: Task accepted; poll the task endpoint until it returns 404, then read the plan.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanAsyncAcceptedResponse'
        '200':
          description: Reused READY plan, or terminal FAILED plan when task submission itself failed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookingPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

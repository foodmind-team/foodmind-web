          type: string
          enum:
            - PERSONAL
            - EXPLORATORY
            - GROUP_INSPIRED
        rank:
          type: integer
          minimum: 1
          maximum: 3
        reasonCodes:
          type: array
          items:
            type: string
            enum:
              - CUISINE_MATCH
              - WITHIN_BUDGET
              - SPICE_MATCH
              - NEARBY
              - NOT_RECENTLY_REPEATED
              - SIMILAR_USERS_LIKED
              - SIMILAR_TO_LIKED_MEALS
              - TRUSTED_GROUP_RATING
              - WANT_TO_TRY
        reasons:
          type: array
          items:
            type: string
          description: Backward-compatible alias for reasonCodes.
        explanation:
          type: string
          description: Allow-listed grounded text linking the model score to confirmed feature evidence; a score is never the sole explanation.
        modelScore:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: Persisted ML probability for model-ranked candidates; null when deterministic fallback was used.
    RecommendationResponse:
      type: object
      required:
        - sessionId
        - traceId
        - status
        - modelStatus
        - fallbackStatus
        - items
      properties:
        sessionId:
          type: string
          format: uuid
        traceId:
          type: string
        status:
          type: string
          enum:
            - CREATED
            - PROCESSING
            - SUCCEEDED
            - FALLBACK_SUCCEEDED
            - NO_VALID_CANDIDATE
            - FAILED
        modelStatus:
          type: string
          enum:
            - NOT_REQUESTED
            - PENDING
            - SUCCEEDED
            - INSUFFICIENT_DATA
            - UNAVAILABLE
            - TIMED_OUT
            - INVALID_RESPONSE
            - FAILED
          description: SUCCEEDED requires modelVersion; every other state permits modelVersion to be absent.
        modelVersion:
          type: string
          nullable: true
        fallbackStatus:
          type: string
          enum:
            - NOT_STARTED
            - NOT_REQUIRED
            - SUCCEEDED
            - NO_VALID_CANDIDATE
            - FAILED
        fallbackVersion:
          type: string
          nullable: true
          description: Absent for NOT_STARTED and NOT_REQUIRED; present for a fallback terminal state.
          example: fallback-v1
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Absent while status is CREATED or PROCESSING; present for every terminal status.
        items:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/RecommendationCandidateResponse'
        candidates:
          type: array
          maxItems: 3
          description: Backward-compatible alias for items.
          items:
            $ref: '#/components/schemas/RecommendationCandidateResponse'

  /drink-records:
    post:
      tags:
        - Drink Records
      summary: Create an owner-controlled drink record.
      description: Owner is derived from the JWT. GROUP visibility requires active membership in the target active group.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'

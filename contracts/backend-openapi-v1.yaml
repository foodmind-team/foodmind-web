  /drink-records/{id}:
    get:
      tags:
        - Drink Records
      summary: Read an authorised drink record detail.
      description: Uses a permission-scoped query and returns non-disclosing 404 when inaccessible.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Drink record detail.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              description: Current optimistic-lock version.
              schema:
                type: string
                example: '"0"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkRecordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Drink Records
      summary: Update an owned drink record.
      description: Requires If-Match with the current version. Non-owners receive non-disclosing 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            example: '"0"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDrinkRecordRequest'
      responses:
        '200':
          description: Updated drink record.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              description: New optimistic-lock version.
              schema:
                type: string
                example: '"1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Drink Records
      summary: Soft-delete an owned drink record.
      description: Repeated owner delete is idempotent. Deleted rows are excluded from normal queries.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Drink record deleted or already deleted for this owner.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /history:
    get:
      tags:
        - History
      summary: Query combined timezone-aware food and drink history.
      description: Uses [from, to) range semantics. Date-only boundaries are interpreted in the resolved IANA timezone; week buckets start on Monday. Ranges over 366 days are rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from
          in: query
          required: true
          schema:
            type: string
          example: "2026-07-26"
        - name: to
          in: query
          required: true
          schema:
            type: string
          example: "2026-07-28"
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum:
              - DAY
              - WEEK
              - MONTH
            default: DAY
        - name: types
          in: query
          required: false
          description: Comma-separated source types.
          schema:
            type: string
            example: FOOD,DRINK
        - name: timeZone
          in: query
          required: false
          schema:
            type: string
            example: Asia/Singapore
        - name: groupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cuisineId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: placeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Presentation-neutral combined history.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
